name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libsoapysdr-dev nlohmann-json3-dev soapysdr-tools
      - name: Build with make, warnings as errors
        run: make WARNINGS="-Wall -Wextra -Werror"
      - name: Build with CMake
        run: cmake -S . -B cmake-build && cmake --build cmake-build
      - name: The module loads and enumerates
        run: SOAPY_SDR_PLUGIN_PATH=$PWD/build SoapySDRUtil --info | grep -i w1700k
